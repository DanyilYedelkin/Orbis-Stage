name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
                                  libxcursor-dev libxi-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DORBIS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Unit tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core + tests only)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DORBIS_SANITIZERS=ON -DORBIS_BUILD_APP=OFF -DORBIS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    # The chunk builder is multi-threaded; TSan detects data races that tests alone would miss.
    name: TSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core + tests only)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DORBIS_TSAN=ON -DORBIS_BUILD_APP=OFF -DORBIS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  render-smoke-test:
    # Renders real frames on a GPU-less runner (Xvfb + Mesa llvmpipe software OpenGL 4.5).
    # Catches shader compile errors and GL setup bugs that unit tests cannot see.
    name: Headless render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
                                  libxcursor-dev libxi-dev xvfb libgl1-mesa-dri
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DORBIS_BUILD_TESTS=OFF
          cmake --build build
      - name: Render frames
        run: |
          RUN='xvfb-run -a -s "-screen 0 1600x900x24" ./build/src/app/orbis --size 1280x720'
          eval $RUN --screenshot earth-orbit.ppm
          eval $RUN --view 44.3,8.6,70,5,-22 --sun 235,25 --screenshot alps.ppm
          eval $RUN --world procedural --view 0.30,-140.75,6.5,45,-10 --screenshot procedural.ppm
          eval $RUN --world procedural --view 0.30,-140.75,6.5,45,-10 --lod-colors --screenshot lod-levels.ppm
          eval $RUN --view 44.3,8.6,70,5,-22 --show-ui --screenshot debug-panel.ppm
          eval $RUN --view 47.5,8.0,0.5,250,12 --sun 220,35 --above-ground --screenshot clouds.ppm
          eval $RUN --view 46.5,8.0,3.5,250,2 --sun 250,3 --screenshot sunset.ppm
          eval $RUN --view 46.4,8.0,0.03,200,-15 --above-ground --sun 250,25 --screenshot surface-detail.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: "*.ppm"
